<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace | Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* =========================================
           MILITARY/HACKER THEME STYLING ADDED BACK!
           ========================================= */
        :root {
            --bg: #050505;
            --accent: #00ff41;
            --danger: #ff003c;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .dashboard-container {
            display: flex; flex-direction: column; height: 100vh;
        }
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #0a0a0a;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }
        .top-nav h2 { margin: 0; font-size: 1.2rem; text-shadow: 0 0 5px var(--accent); }
        .btn-danger {
            background: transparent; border: 1px solid var(--danger);
            color: var(--danger); padding: 5px 15px; cursor: pointer;
            font-weight: bold; text-shadow: 0 0 5px var(--danger);
            box-shadow: inset 0 0 5px rgba(255, 0, 60, 0.2);
        }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        
        .main-content { display: flex; flex: 1; height: calc(100vh - 50px); }
        
        .sidebar {
            width: 320px; padding: 20px;
            border-right: 2px solid var(--accent);
            background: rgba(0, 20, 0, 0.4);
            display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto;
        }
        
        /* Radar Animation */
        .radar-box {
            width: 100%; aspect-ratio: 1;
            border: 2px solid var(--accent); border-radius: 50%;
            position: relative; overflow: hidden;
            background: repeating-radial-gradient(transparent, transparent 20px, rgba(0,255,65,0.2) 21px);
            box-shadow: 0 0 15px rgba(0,255,65,0.3);
        }
        .radar {
            width: 50%; height: 50%; position: absolute; top: 0; left: 50%;
            transform-origin: bottom left;
            background: linear-gradient(90deg, rgba(0,255,65,0.8), transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 100% { transform: rotate(360deg); } }
        
        .info-box {
            border: 1px solid #333; padding: 15px; background: rgba(0,0,0,0.6);
        }
        .info-box p { margin: 10px 0; font-size: 0.9rem; }
        
        .btn-primary {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--accent); color: var(--accent);
            padding: 12px; cursor: pointer; text-transform: uppercase;
            font-weight: bold; transition: 0.3s;
        }
        .btn-primary:hover {
            background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent);
        }
        
        .map-area { flex: 1; position: relative; background: #000; }
        
        /* Dark Theme filter for OpenStreetMap */
        #map {
            width: 100%; height: 100%;
            filter: invert(100%) hue-rotate(160deg) brightness(95%) contrast(90%);
        }
        
        /* HUD Corners & Crosshair */
        .hud-corner {
            position: absolute; width: 40px; height: 40px;
            border: 3px solid var(--accent); z-index: 1000; pointer-events: none;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }
        
        .crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; transform: translate(-50%, -50%);
            border: 1px solid rgba(0,255,65,0.5); border-radius: 50%;
            z-index: 1000; pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: rgba(0,255,65,0.7);
        }
        .crosshair::before { top: 50%; left: -15px; right: -15px; height: 1px; }
        .crosshair::after { left: 50%; top: -15px; bottom: -15px; width: 1px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        
        <nav class="top-nav">
            <h2>SYS.SECURE_TRACE // COMMAND_CENTER</h2>
            <button class="btn-danger" onclick="logout()">DISCONNECT</button>
        </nav>

        <div class="main-content">
            <div class="sidebar">
                <div class="radar-box">
                    <div class="radar"></div>
                </div>

                <div class="info-box">
                    <p><strong>PHONE / IMEI:</strong> <span style="color: #00ff41; background: rgba(0,255,65,0.1); padding: 2px 5px; border: 1px solid #00ff41;" id="display-key">LOADING...</span></p>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                    <p><strong>STATUS:</strong> <span style="color: #ff003c;" id="status">OFFLINE</span></p>
                    <p><strong>LATITUDE:</strong> <span id="lat">--.-----</span></p>
                    <p><strong>LONGITUDE:</strong> <span id="lng">--.-----</span></p>
                    <p><strong>ACCURACY:</strong> <span id="acc">-- meters</span></p>
                </div>
                
                <button class="btn-primary" id="track-btn" style="width: 100%;">ACTIVATE LIVE TRACKING</button>
            </div>

            <div class="map-area">
                <div id="map"></div>
                <div class="hud-corner top-left"></div>
                <div class="hud-corner top-right"></div>
                <div class="hud-corner bottom-left"></div>
                <div class="hud-corner bottom-right"></div>
                <div class="crosshair"></div>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
