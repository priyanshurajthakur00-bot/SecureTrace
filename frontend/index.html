<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace | Master Control</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .fullscreen-map { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; border-radius: 0 !important; border: none !important; margin: 0 !important; padding: 0 !important; background: #000 !important;}
        .btn-fullscreen { position: absolute; top: 15px; right: 15px; z-index: 10000; background: rgba(0, 0, 0, 0.8); color: #00ff41; border: 2px solid #00ff41; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .btn-fullscreen:hover { background: #00ff41; color: #000; }
        .intel-box { border: 1px solid var(--accent); background: rgba(0,0,0,0.5); text-align: center; overflow: hidden; margin-top: 10px;}
        .intel-box img { width: 100%; display: none; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="login-container" id="main-container" style="width: 100%; max-width: 450px; padding: 20px; transition: max-width 0.4s ease;">
        <div class="header">
            <h1>SYS.SECURE_TRACE</h1>
            <p class="subtitle" id="form-subtitle">GLOBAL ANTI-THEFT NETWORK</p>
        </div>

        <div class="login-box" id="auth-section">
            <div class="input-group"><label>USERNAME</label><input type="text" id="username"></div>
            <div class="input-group"><label>PASSWORD</label><input type="password" id="password"></div>
            <button class="btn-primary" onclick="processAuth()" id="actionBtn">SECURE LOGIN</button>
            <div class="divider"><span>OR</span></div>
            <button class="btn-google" onclick="toggleForm()" id="toggleBtn">CREATE NEW ACCOUNT</button>
        </div>

        <div class="login-box" id="menu-section" style="display: none; text-align: center;">
            <h3 style="color: #00ff41; margin-bottom: 20px;">WELCOME, <span id="agent-name"></span></h3>
            <button class="btn-primary" onclick="activateTracking()" style="margin-bottom: 15px;">🗺️ TRACK LOST PHONE</button>
            <button class="btn-google" onclick="activateProtection()" style="border-color: #ff003c; color: #ff003c;">🛡️ PROTECT THIS DEVICE</button>
            <button class="btn-logout" onclick="logout()" style="margin-top: 30px; width: 100%;">DISCONNECT</button>
        </div>

        <div class="login-box" id="protect-section" style="display: none; text-align: center;">
            <div class="blinking-dot" style="margin: 0 auto 15px auto;"></div>
            <h3 style="color: #00ff41; margin-bottom: 15px;">🛡️ PROTECTION ACTIVE</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">System is bypassing security to fetch Intel...</p>
            <!-- Logs yahan dikhenge clear clear -->
            <p id="cam-log" style="font-size: 12px; color: #f39c12; margin-bottom: 5px;"></p>
            <p id="gps-log" style="font-size: 13px; color: #00f3ff; font-weight: bold;"></p>
            <button class="btn-logout" onclick="location.reload()" style="margin-top: 30px; width: 100%;">STOP PROTECTION</button>
        </div>

        <div id="track-section" style="display: none; width: 100%;">
            <div style="height: 75vh; width: 100%; display: flex; gap: 20px; flex-wrap: wrap;">
                
                <div class="target-details hud-box" style="flex: 1; min-width: 250px; max-height: 100%; overflow-y: auto;">
                    <div class="corner-tl"></div><div class="corner-tr"></div>
                    <div class="corner-bl"></div><div class="corner-br"></div>
                    <h3><span class="blinking-dot" style="display:inline-block; margin-right:10px;"></span>TARGET UPLINK</h3>
                    <div class="info-box" style="font-size: 13px;">
                        <p>STATUS: <span id="status" style="color: #f39c12;">WAITING FOR TARGET DATA...</span></p>
                        <p>IP ADDR: <span id="ip-addr" style="color: #00f3ff;">--</span></p>
                        <p>BATTERY: <span id="batt">--%</span></p>
                        <p>NETWORK: <span id="net">--</span></p>
                        <p>LATITUDE: <span id="lat">--.-----</span></p>
                        <p>LONGITUDE: <span id="lng">--.-----</span></p>
                    </div>
                    
                    <h4 style="color: #00ff41; margin-top:15px; border-bottom:1px solid #333; padding-bottom:5px;">📷 CAMERA INTEL</h4>
                    <button class="btn-google" onclick="requestPhoto()" id="captureBtn" style="margin-top: 10px; width: 100%; font-size: 12px; border-color: #00f3ff; color: #00f3ff;">📸 CAPTURE TARGET PHOTO</button>
                    
                    <div class="intel-box">
                        <img id="thief-photo" src="">
                        <p id="photo-status" style="font-size:11px; padding:20px; color:#aaa;">AWAITING COMMAND...</p>
                    </div>

                    <button class="btn-logout" onclick="location.reload()" style="margin-top: 20px; width: 100%;">EXIT MAP</button>
                </div>
                
                <div class="map-area hud-box" id="map-container" style="flex: 2; min-width: 300px; padding: 5px; position: relative;">
                    <button class="btn-fullscreen" id="fs-btn" onclick="toggleFullScreen()">⛶ FULL SCREEN</button>
                    <div id="map" style="width: 100%; height: 100%; min-height: 300px; border-radius: 10px;"></div>
                    <div class="crosshair"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script> 
    
    <script>
        let isLoginMode = true;
        let globalDeviceId = "";
        let map, marker, circle, trackingInterval;
        let isFirstLocationLoad = true;
        let isFullScreen = false;
        let targetIp = "Detecting...";
        let cameraAccessed = false;

        // Auto-Login Check
        window.onload = function() {
            const savedUser = localStorage.getItem('sys_username');
            const savedDevId = localStorage.getItem('sys_device_id');
            if(savedUser && savedDevId) {
                globalDeviceId = savedDevId;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('menu-section').style.display = 'block';
                document.getElementById('agent-name').innerText = savedUser.toUpperCase();
                document.getElementById('form-subtitle').innerText = 'ACTION MENU';
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function toggleFullScreen() {
            const mapBox = document.getElementById('map-container');
            const fsBtn = document.getElementById('fs-btn');
            if(!isFullScreen) {
                mapBox.classList.add('fullscreen-map'); fsBtn.innerText = "✖ EXIT FULL SCREEN"; isFullScreen = true;
            } else {
                mapBox.classList.remove('fullscreen-map'); fsBtn.innerText = "⛶ FULL SCREEN"; isFullScreen = false;
            }
            setTimeout(() => { if(map) map.invalidateSize(); }, 300);
        }

        function toggleForm() {
            isLoginMode = !isLoginMode;
            document.getElementById('actionBtn').innerText = isLoginMode ? 'SECURE LOGIN' : 'REGISTER NOW';
            document.getElementById('toggleBtn').innerText = isLoginMode ? 'CREATE NEW ACCOUNT' : 'BACK TO LOGIN';
            document.getElementById('form-subtitle').innerText = isLoginMode ? 'GLOBAL ANTI-THEFT NETWORK' : 'NEW USER REGISTRATION';
        }

        function processAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('actionBtn');

            if(!user || !pass) return alert("Enter Username & Password!");
            btn.innerText = "PROCESSING...";
            
            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            fetch(endpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass, deviceId: "DEV-" + Math.floor(Math.random()*99999) })
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    if(isLoginMode) {
                        globalDeviceId = data.deviceId;
                        localStorage.setItem('sys_username', user);
                        localStorage.setItem('sys_device_id', data.deviceId);
                        
                        document.getElementById('auth-section').style.display = 'none';
                        document.getElementById('menu-section').style.display = 'block';
                        document.getElementById('agent-name').innerText = user.toUpperCase();
                        document.getElementById('form-subtitle').innerText = 'ACTION MENU';
                    } else { alert("Account Created! You can now Login."); toggleForm(); }
                } else { alert("Error: " + data.message); }
                btn.innerText = isLoginMode ? "SECURE LOGIN" : "REGISTER NOW";
            }).catch(err => { alert("Server error! Waking up..."); btn.innerText = "SECURE LOGIN"; });
        }

        // ==========================================
        // 🛡️ PROTECT MODE (Camera & GPS)
        // ==========================================
        function activateProtection() {
            document.getElementById('menu-section').style.display = 'none';
            document.getElementById('protect-section').style.display = 'block';
            document.getElementById('form-subtitle').innerText = 'DEVICE SECURED';
            
            const camLog = document.getElementById('cam-log');
            const gpsLog = document.getElementById('gps-log');
            
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => { targetIp = d.ip; }).catch(e=>{});

            // CAMERA CHECK
            camLog.innerText = "Requesting Camera Access...";
            if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => { 
                    camLog.innerText = "📷 Camera Ready (Stealth Mode).";
                    camLog.style.color = "#00ff41";
                    stream.getTracks().forEach(track => track.stop()); 
                }).catch(e => {
                    camLog.innerText = "⚠️ Camera Blocked by User/Browser.";
                    camLog.style.color = "#ff003c";
                });
            } else {
                camLog.innerText = "⚠️ Camera not supported on this browser.";
            }

            // COMMAND LISTENER
            setInterval(() => {
                fetch('/api/check-command', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: globalDeviceId })
                }).then(r=>r.json()).then(data => {
                    if(data.command === "TAKE_PHOTO" && !cameraAccessed) {
                        cameraAccessed = true;
                        takeStealthPhoto();
                    }
                }).catch(e => {}); 
            }, 3000);

            // GPS CHECK WITH FALLBACK
            if (navigator.geolocation) {
                gpsLog.innerText = "Acquiring GPS Signal... Please wait (Max 10s).";
                
                // Humne timeout 10000 lagaya hai taaki atak na jaye
                navigator.geolocation.watchPosition(async (position) => {
                    sendDataToServer(position);
                }, (err) => { 
                    gpsLog.innerText = "⚠️ GPS Failed (Code " + err.code + "). Retrying low accuracy...";
                    gpsLog.style.color = "#f39c12";
                    
                    // Fallback: Agar high accuracy fail ho, toh normal location nikalo
                    navigator.geolocation.getCurrentPosition((pos) => {
                        sendDataToServer(pos);
                    }, (e) => {
                        gpsLog.innerText = "❌ Location Access Denied or Blocked!";
                        gpsLog.style.color = "#ff003c";
                    }, { enableHighAccuracy: false, timeout: 10000 });

                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            }
        }

        async function sendDataToServer(position) {
            const gpsLog = document.getElementById('gps-log');
            let batteryStr = "Unknown", netStr = "Unknown";
            if (navigator.getBattery) {
                try { let bat = await navigator.getBattery(); batteryStr = Math.round(bat.level * 100) + "%"; if(bat.charging) batteryStr += " ⚡"; } catch(e) {}
            }
            if (navigator.connection) netStr = navigator.connection.effectiveType ? navigator.connection.effectiveType.toUpperCase() : "ONLINE";

            fetch('/api/update-location', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    deviceId: globalDeviceId, lat: position.coords.latitude, lng: position.coords.longitude, 
                    accuracy: position.coords.accuracy, battery: batteryStr, network: netStr, ipAddress: targetIp
                })
            }).then(() => {
                gpsLog.innerText = `✅ [SUCCESS] Location & Intel Synced: ${new Date().toLocaleTimeString()}`;
                gpsLog.style.color = "#00ff41";
            }).catch(e => { gpsLog.innerText = "Syncing... Server offline."; gpsLog.style.color = "#ff003c"; });
        }

        function takeStealthPhoto() {
            if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.createElement('video');
                    video.srcObject = stream; video.play();
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 320; canvas.height = 240;
                        canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                        const photoData = canvas.toDataURL('image/jpeg', 0.6);
                        stream.getTracks().forEach(track => track.stop()); 
                        
                        fetch('/api/upload-photo', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ deviceId: globalDeviceId, photoUrl: photoData })
                        }).then(() => { cameraAccessed = false; });
                    }, 1500);
                }).catch(err => { cameraAccessed = false; });
            }
        }

        // ==========================================
        // 🗺️ TRACK MODE
        // ==========================================
        function activateTracking() {
            document.getElementById('menu-section').style.display = 'none';
            document.getElementById('track-section').style.display = 'block';
            document.getElementById('form-subtitle').innerText = 'LIVE TRACKING';
            document.getElementById('main-container').style.maxWidth = '1100px'; 

            setTimeout(() => {
                if(!map) {
                    map = L.map('map').setView([20.0, 0.0], 2);
                    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 19, attribution: '© Google Maps' }).addTo(map);
                }
                map.invalidateSize(); 
                isFirstLocationLoad = true;
                trackingInterval = setInterval(fetchTargetLocation, 3000);
                fetchTargetLocation();
            }, 400); 
        }

        function requestPhoto() {
            const btn = document.getElementById('captureBtn');
            btn.innerText = "COMMAND SENT... WAITING";
            fetch('/api/send-command', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: globalDeviceId, command: "TAKE_PHOTO" })
            }).then(() => {
                setTimeout(() => { btn.innerText = "📸 CAPTURE TARGET PHOTO"; }, 6000);
            });
        }

        function fetchTargetLocation() {
            fetch('/api/get-location', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: globalDeviceId })
            }).then(res => res.json()).then(data => {
                if (data.lat && data.lng) {
                    document.getElementById('lat').innerText = data.lat.toFixed(5);
                    document.getElementById('lng').innerText = data.lng.toFixed(5);
                    document.getElementById('acc').innerText = Math.round(data.accuracy) + " meters";
                    document.getElementById('batt').innerText = data.battery; 
                    document.getElementById('net').innerText = data.network;
                    document.getElementById('ip-addr').innerText = data.ipAddress; 
                    
                    if(data.photoUrl && data.photoUrl.length > 100) {
                        document.getElementById('photo-status').style.display = 'none';
                        const img = document.getElementById('thief-photo');
                        img.src = data.photoUrl;
                        img.style.display = 'block';
                    }

                    document.getElementById('status').innerText = data.status;
                    document.getElementById('status').style.color = "#00ff41";

                    if (marker) { map.removeLayer(marker); map.removeLayer(circle); }
                    marker = L.marker([data.lat, data.lng]).addTo(map);
                    circle = L.circle([data.lat, data.lng], { radius: data.accuracy, color: 'red' }).addTo(map);
                    
                    if (isFirstLocationLoad) { map.setView([data.lat, data.lng], 18); isFirstLocationLoad = false; }
                } else {
                    document.getElementById('status').innerText = "TARGET OFFLINE (NO DATA YET)";
                    document.getElementById('status').style.color = "#ff003c";
                }
            }).catch(err => {
                document.getElementById('status').innerText = "WAKING UP SERVER... PLEASE WAIT";
                document.getElementById('status').style.color = "#f39c12"; 
            });
        }
    </script>
</body>
</html>
