<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace | Advanced Location Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-container { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--text-dim); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-dim); transition: 0.3s; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="login-container">
        <div class="header">
            <h1>SYS.SECURE_TRACE</h1>
            <p class="subtitle">MULTI-USER TRACKING TERMINAL</p>
        </div>

        <div class="login-box">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('login')">AUTHENTICATE</div>
                <div class="tab" onclick="switchTab('register')">NEW_USER</div>
            </div>

            <!-- LOGIN FORM -->
            <div id="login-form" class="form-section active">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" placeholder="Enter identification..." id="login-username">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Enter password..." id="login-password">
                </div>
                <button class="btn-primary" onclick="attemptLogin()" id="loginBtn">INITIALIZE CONNECTION</button>
            </div>

            <!-- REGISTER FORM -->
            <div id="register-form" class="form-section">
                <div class="input-group">
                    <label>DESIRED_USERNAME</label>
                    <input type="text" placeholder="Create a username..." id="reg-username">
                </div>
                <div class="input-group">
                    <label>CREATE_PASSWORD</label>
                    <input type="password" placeholder="Create a strong password..." id="reg-password">
                </div>
                <div class="input-group">
                    <label>PHONE NO. / IMEI</label>
                    <input type="text" placeholder="Enter device identifier..." id="reg-device">
                </div>
                <button class="btn-primary" onclick="attemptRegister()" id="regBtn">CREATE ACCOUNT</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            
            if(tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        function attemptRegister() {
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const device = document.getElementById('reg-device').value;
            const btn = document.getElementById('regBtn');

            if(user === "" || pass === "" || device === "") {
                alert("Please fill all fields!");
                return;
            }

            btn.innerText = "REGISTERING...";
            
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass, deviceId: device })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("Registration Successful! Please Login now.");
                    switchTab('login');
                } else {
                    alert("ERROR: " + data.message);
                }
                btn.innerText = "CREATE ACCOUNT";
            })
            .catch(err => {
                alert("Server Connection Error");
                btn.innerText = "CREATE ACCOUNT";
            });
        }

        function attemptLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            const btn = document.getElementById('loginBtn');

            if(user === "" || pass === "") {
                alert("PLEASE ENTER CREDENTIALS.");
                return;
            }

            btn.innerText = "AUTHENTICATING...";

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    localStorage.setItem('sys_auth_token', 'granted');
                    localStorage.setItem('sys_username', user);
                    localStorage.setItem('sys_device_id', data.deviceId); 
                    window.location.href = 'dashboard.html';
                } else {
                    alert("ERROR: " + data.message);
                    btn.innerText = "INITIALIZE CONNECTION";
                }
            })
            .catch(err => {
                alert("Server Error");
                btn.innerText = "INITIALIZE CONNECTION";
            });
        }
    </script>
</body>
</html>
