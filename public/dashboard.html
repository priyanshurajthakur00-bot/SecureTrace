<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace | Command Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="dashboard-container">
        
        <nav class="top-nav">
            <h2>SYS.SECURE_TRACE // COMMAND_CENTER</h2>
            <button class="btn-danger" onclick="logout()">DISCONNECT</button>
        </nav>

        <div class="main-content">
            <div class="sidebar">
                <div class="radar-box">
                    <div class="radar"></div>
                </div>

                <div class="info-box">
                    <p><strong>PHONE / IMEI:</strong> <span style="color: #00ff41; background: rgba(0,255,65,0.1); padding: 2px 5px; border: 1px solid #00ff41;" id="display-key">LOADING...</span></p>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                    
                    <p><strong>STATUS:</strong> <span style="color: #ff003c;" id="status">OFFLINE</span></p>
                    <p><strong>LATITUDE:</strong> <span id="lat">--.-----</span></p>
                    <p><strong>LONGITUDE:</strong> <span id="lng">--.-----</span></p>
                    <p><strong>ACCURACY:</strong> <span id="acc">-- meters</span></p>
                </div>
                
                <button class="btn-primary" id="track-btn" style="width: 100%; margin-top: 20px;">ACTIVATE LIVE TRACKING</button>
            </div>

            <div class="map-area">
                <div id="map"></div>
                <div class="hud-corner top-left"></div>
                <div class="hud-corner top-right"></div>
                <div class="hud-corner bottom-left"></div>
                <div class="hud-corner bottom-right"></div>
                <div class="crosshair"></div>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
