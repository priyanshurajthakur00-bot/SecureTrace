<!DOCTYPE html>
<html lang="en">
<<script>
    // Agar local storage mein secret token nahi hai, toh wapas login page par fenk do
    if (localStorage.getItem('sys_auth_token') !== 'granted') {
        alert("SECURITY BREACH DETECTED! Rerouting to login...");
        window.location.href = 'index.html';
    }
</script>
>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace | Live Tracking Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="dashboard-body">
    <!-- Matrix Background Dashboard ke liye -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <h2>SYS.SECURE_TRACE // COMMAND_CENTER</h2>
        <div class="nav-right">
            <span class="blinking-dot"></span> LIVE LINK ACTIVE
            <button class="btn-logout" onclick="window.location.href='index.html'">DISCONNECT (LOGOUT)</button>
        </div>
    </nav>

    <!-- Main Dashboard Area -->
    <div class="dashboard-container">
        
        <!-- Sidebar Target Details (Hacker HUD Box) -->
        <div class="target-details hud-box">
            <!-- Charo Kono ke borders -->
            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
            
            <h3>TARGET_INFORMATION</h3>
            
                       <div class="info-box">
                <!-- NAYI LINE: User ki secret key yahan hamesha dikhegi -->
                <p><strong>YOUR SECRET KEY:</strong> <span style="color: #00ff41; background: rgba(0,255,65,0.1); padding: 2px 5px; border: 1px solid #00ff41;" id="display-key">LOADING...</span></p>
                <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                
                <p><strong>STATUS:</strong> <span style="color: #ff003c;" id="status">OFFLINE</span></p>
                <p><strong>LATITUDE:</strong> <span id="lat">--.-----</span></p>
                <p><strong>LONGITUDE:</strong> <span id="lng">--.-----</span></p>
                <p><strong>ACCURACY:</strong> <span id="acc">-- meters</span></p>
                <p><strong>IP TRACE:</strong> <span style="color: var(--accent);">SCANNING...</span></p>
            </div>

            
            <!-- Radar Scanner Animation -->
            <div class="radar-box">
                <div class="radar-scan"></div>
            </div>

            <button class="btn-logout" onclick="localStorage.removeItem('sys_auth_token'); window.location.href='index.html'">DISCONNECT (LOGOUT)</button>
            <p class="subtitle" style="margin-top: 15px; text-align: left; color: #ff003c;">*WARNING: GPS override protocol active...</p>
        </div>

        <!-- Map Area (Hacker HUD Box) -->
        <div class="map-area hud-box">
            <!-- Charo Kono ke borders -->
            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
            
            <!-- Center Focus Crosshair -->
            <div class="crosshair"></div>
            
            <div id="map"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script> <!-- Matrix rain chalu karne ke liye -->
    <script src="js/dashboard.js"></script> <!-- Map ka logic -->
</body>
</html>
